# Nao tive tempo ver as aulas do classroom por isso nao sei se devia usar isso ou persistence.xml


# Configura\u00e7\u00e3o do Banco H2 em Mem\u00f3ria
spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
# essa parte que \u00e9 update significa que o hibernate vai atualizar ou adicionar dados no banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


